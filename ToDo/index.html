    <script>

        var todoList = []
        var selectedTodoId = null

        function addTodo()
        {
          
            let newTodoTitle = document.getElementById("newTodoInput").value
          
            todoList.push({
                id: todoList.length+1 ,
                title: newTodoTitle
            })
           
            let dialog = document.getElementById("todoDialog")
            dialog.close()
            updateFrontend()
        }

        function updateFrontend()
        {
            let todoListElement = document.getElementById("todoListElement")
            todoListElement.innerHTML = ""
            for(index in todoList)
            {
                
                todoListElement.innerHTML += "<ul class='fa-ul'>" + "<li title='Click to Update / Delete' ' onclick='todoClicked("+todoList[index].id+")'>" + "<span class='fa-li'><i class='fas fa-paw'></i></span>" + todoList[index].title+"</li>"+"</ul>";
               
            }
           
             newTodoInput.value = ""
           
        }

        //   function updateFrontend()
        // {
        //     let todoListElement = document.getElementById("todoListElement")
        //     todoListElement.innerHTML = ""
        //     for(let item of todoList)
        //     {
        //           if (!item.title || item.title.trim() === "") {
        //     alert("Empty task found!");
        //     continue;
        // }
        //         todoListElement.innerHTML += "<ul class='fa-ul'>" + "<li title='Click to Update / Delete' ' onclick='todoClicked("+todoList[item].id+")'>" + "<span class='fa-li'><i class='fas fa-paw'></i></span>" + todoList[item].title+"</li>"+"</ul>";
               
        //     }
           
        //      newTodoInput.value = ""
           
        // }
        
    
        

        function todoClicked(id)
         {
        console.log("todoClicked:", id);

        
        let todoToUpdate = todoList.find(todoTemp => todoTemp.id === id);

        if (todoToUpdate)
         {
        
            document.getElementById("updateInput").value = todoToUpdate.title;

    
            selectedTodoId = id;


            document.getElementById("todoUpdateDialog").showModal();
            }
        }

        function updateTodo()
        {
            let updatedTitle = document.getElementById("updateInput").value
            let todoToUpdate = todoList.find(todoTemp => todoTemp.id === selectedTodoId);
            if (todoToUpdate)
            {
                todoToUpdate.title = updatedTitle; 
            }
            updateFrontend(); 
            closeUpdateDialog(); 
            
        }

        function deleteTodo(id)
        {
            
           if(confirm("Do you want to delete this task?"))
           {
            todoList = todoList.filter(todoTemp => todoTemp.id !== id);
            updateFrontend();
            document.getElementById("updateInput").value = ""
            closeUpdateDialog();
            }
            else
            {
                 closeUpdateDialog();
            }
        }


        function openUpdateDialog()
        {
            let dialog = document.getElementById("todoUpdateDialog")
            dialog.showModal()
        }

        function closeUpdateDialog()
        {
            let dialog = document.getElementById("todoUpdateDialog")
            dialog.close()
        }

        function openDialog()
        {
            let dialog = document.getElementById("todoDialog")
            dialog.showModal()
        }
        function closeDialog()
        {
            let dialog = document.getElementById("todoDialog")
            dialog.close()

        }

        function toggleTheme() {
        let body = document.body;

        if (body.classList.contains("day")) {
            body.classList.remove("day");
            body.classList.add("night");
        } else {
            body.classList.remove("night");
            body.classList.add("day");
        }

        localStorage.setItem("theme", body.classList.contains("night") ? "night" : "day");
        }

    
        window.onload = function() {
        let savedTheme = localStorage.getItem("theme") || "day";
        document.body.classList.add(savedTheme);
        };


       
     </script>

        <dialog id="todoDialog">

                    <h2 style="font-family: Arial, Helvetica, sans-serif ; font-size: 22px; margin-bottom: 4%;">Add New Task</h2>
                    <br>
                    <label for="newTodoInput" style="font-size: medium;">Task Title</label><br> 
                    <input id="newTodoInput" type="text" placeholder="Enter new task title..."  style="margin-top: 3px; border-radius: 5px; height:28px; font-size: medium; background-color: rgb(226, 225, 225); border-color: rgb(194, 190, 190) ;"/>&nbsp;<label  for="newTodoInput" title="Enter Task"><i class="fas fa-pencil" style="font-size:mdeium;" ></i></label>
                    <br><br><br>
                    <button onclick="closeDialog()" class="close" title="Click to Exit">Cancel</button>
                   &nbsp;
                   <button onclick="addTodo()" class="addTask" title="Click to Add Task">Add Task</button>
                   
                </div>
        </dialog>

         
        <dialog id="todoUpdateDialog">
            <div class="dialog-content">
                <h2  style="font-family: Arial, Helvetica, sans-serif ; font-size: 22px; margin-bottom: 0;">Update Task</h2>                
                <i class="fas fa-trash-alt " id="delete" title="Click to Delete Task" onclick="deleteTodo(selectedTodoId)" style="color:rgb(123, 123, 123); font-size: 17px; float:right; margin-bottom: 10%;"></i>

                 <div style="margin-top:30px;">
                <label for="updateInput">Task Title</label><br>
                <input id="updateInput" type="text" placeholder="Update Task..." style="margin-top: 3px; border-radius: 5px; height:28px; font-size: medium;  background-color: rgb(226, 225, 225); border-color: rgb(194, 190, 190) ;"/>
                </div> 
                <br/><br>
                  <button onclick="closeUpdateDialog()" class="close"  title="Click to Exit">Cancel</button>
                  &nbsp;&nbsp;
                <button onclick="updateTodo()" title=" Click to Update Task" id="uptdate">Update</button>
              
              
            </div>
        </dialog>
