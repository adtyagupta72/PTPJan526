<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset='utf-8'>
        <!-- This line makes things resonsive in our web page by default -->
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <!-- This line makes things resonsive in our web page by default -->
        <title>Responsive Web Page!</title>
        <style>
            .left
            {
                background-color: aqua;
                padding: 20px;
                float: left;
                width: 16%;
            }
            .center
            {
                background-color: bisque;
                padding: 20px;
                float: left;
                width: 60%;
            }
            .right
            {
                background-color: blueviolet;
                padding: 20px;
                float: left;
                width: 16%;
            }
            @media screen and (max-width: 800px) {
                .left, .center, .right{
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>

        <div class="left">
