<!DOCTYPE html>
<html lang="en">

<body>
    <center><h1>Student Admission Form</h1></center>
    <p><i>Students must fill out this form for new admission registration</i></p>
    <form action="action.html" method="post">
        <label for="info" >Student's name</label>
        <input type="text" name="info" id="info"><br>
        <label for="email" >Email</label>
        <input type="email" name="email"><br>
         <label for="paas" >Password</label>
        <input type="password" name="paas"><br>
        <label>Gender:</label><BR>
        <input type="radio" name="gen" id="gen">
        <label for="gen" >Male</label><BR>
        <input type="radio" name="gen" id="gen">
        <label for="gen" >Female</label><BR>
        <label for="bday">Birthday:</label>    
        <input type="date" name="bday"><br>
        <label for="NUMBER">Phone number</label>    
        <input type="tel" name="NUMBER" pattern="[0-9]{10}"><br>
        <label>Subjects:</label><br>
        <input type="checkbox" name="box" id="box">
        <label for="gen" >English</label><BR>
        <input type="checkbox" name="box" id="box">
        <label for="gen" >Hindi</label><BR>
        <input type="checkbox" name="box" id="box">
        <label for="gen" >Mathematics</label><BR>
        <input type="checkbox" name="box" id="box">
        <label for="gen" >Science</label><BR>
        <button type="submit">Submit</button>    
        
        
        
    </form>

</body>
</html>
