<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var todoList = []
        
        function addTodo()
        {
            let inputTodoelement = document.getElementById("inputTodo").value
            todoList.push (inputTodoelement)
            updateFrontend()
        }
        function updateFrontend()
        {
            let elementTodo = document.getElementById("element") 
            elementTodo.innerHTML = ""
            for ( index in todoList)
        {
            elementTodo.innerHTML += "<li>"+ todoList[index]+ "</li>"
        }
        }
    </script>
</head>

<body>

    <ul id="element">
       
    </ul> -->

   
</body>
</html>
