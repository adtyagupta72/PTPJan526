     <div class="container">
       <center> <h1><strong><span style="color:rgb(182, 130, 68)">X</span></strong> vs <strong><spanO style="color: rgb(119, 90, 52)">O</span></strong> Battle</h1></center>
    <div class="board">
      <div class="grid">
       <div class="box" style="width:82px; height:80px; background-color: rgb(56, 40, 21); float:right; margin:0;"></div>
        <div class="box" style="width:82px; height:80px; background-color: rgb(88, 73, 54); float:right; margin:0;"></div>

        <div class="box" style="width:82px; height:80px; background-color: rgb(88, 73, 54); float:right; margin:0;"></div>

       <button id="reset-btn">Reset Game</button>

    <script>
  let boxes = document.querySelectorAll(".box");
let resetBtn = document.querySelector("#reset-btn");
let newGameBtn = document.querySelector("#new-btn");
let msgContainer = document.querySelector(".msg-container");
let msg = document.querySelector("#msg");

let turnO = true; 
let count = 0;

const winPatterns = [
  [0, 1, 2],
  [0, 3, 6],
  [0, 4, 8],
  [1, 4, 7],
  [2, 5, 8],
  [2, 4, 6],
  [3, 4, 5],
  [6, 7, 8],
];

const resetGame = () => {
  turnO = true;
  count = 0;
  enableBoxes();
  msgContainer.classList.add("hide")
  enableResetBtn();
};

boxes.forEach((box) => {
  box.addEventListener("click", () => {
    if (turnO) {
     
      box.innerHTML =` <span class="o">O<span>`
      turnO = false;
    } else {
     
      box.innerHTML = `<span class="x">X<span>`
      turnO = true;
    }
   box.style.pointerEvents = "none";
    count++;

    let isWinner = checkWinner();

    if (count === 9 && !isWinner) {
      gameDraw();
    }
  });
});

const gameDraw = () => {
  msg.innerText = `Game was a Draw.`;
  msgContainer.classList.remove("hide");
  disableBoxes();
};

 

// const enableBoxes = () => {
//   for (let box of boxes) {
//     box.disabled = false;
//     box.innerText = "";
//   }
// };

const showWinner = (winner, pattern) => {
  msg.innerText = `Congratulations, Winner is ${winner} 🎉`;
  msgContainer.classList.remove("hide");

 
  pattern.forEach(index => {
    boxes[index].classList.add("winner");
  });

  disableBoxes();
  disableresetbtn();
}

const disableresetbtn = () => {
 const resetBtn = document.getElementById("reset-btn");
   resetBtn.disabled  = true;
  }

  const enableResetBtn = () => {
  const resetBtn = document.getElementById("reset-btn"); 
  resetBtn.disabled = false; 
};

const disableBoxes = () => {
  for (let box of boxes) {
    box.style.pointerEvents = "none";  
  }
};

const enableBoxes = () => {
  for (let box of boxes) {
    box.style.pointerEvents = "auto";  
    box.innerText = "";
    box.classList.remove("winner");   
  }
};




const checkWinner = () => {
  for (let pattern of winPatterns) {
    let pos1Val = boxes[pattern[0]].innerText;
    let pos2Val = boxes[pattern[1]].innerText;
    let pos3Val = boxes[pattern[2]].innerText;

    if (pos1Val != "" && pos2Val != "" && pos3Val != "") {
      if (pos1Val === pos2Val && pos2Val === pos3Val) {
        showWinner(pos1Val, pattern);

        return true;
      }
    }
  }
};

newGameBtn.addEventListener("click", resetGame);
resetBtn.addEventListener("click", resetGame);

        
  </script>
